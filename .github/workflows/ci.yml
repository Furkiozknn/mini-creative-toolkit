name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.11"

      # ffmpeg/ffprobe are NOT preinstalled on the ubuntu-latest runner image
      # (confirmed via a real CI failure, exit 127) - install explicitly.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg is available
        run: ffmpeg -version && ffprobe -version

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run pytest -v
