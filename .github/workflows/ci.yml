name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 105 sn
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    # setup-uv@v3 has no `python-version` input - passing one produced only an
    # "Unexpected input(s)" warning, and every matrix leg silently ran on the
    # runner's default interpreter. UV_PYTHON is read by uv itself, which
    # downloads the interpreter if the runner does not have it.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      # (confirmed via a real CI failure, exit 127) - install explicitly.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg is available
        run: ffmpeg -version && ffprobe -version

      - name: Install dependencies
        run: uv sync

      # Asserted, because the previous form of this matrix looked like it was
      # testing three interpreters while testing one three times.
      - name: The interpreter really is the one this matrix leg claims
        run: |
          actual=$(uv run python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")
          echo "matrix asked for ${{ matrix.python-version }}, uv resolved $actual"
          test "$actual" = "${{ matrix.python-version }}" || {
            echo "matrix leg ${{ matrix.python-version }} actually ran on $actual"; exit 1; }

      - name: Run tests
        run: uv run pytest -v

  # The video/security tests skip themselves without ffmpeg. That is correct
  # behaviour, but it means a break in the ffmpeg path could hide behind a
  # skip. This job proves the *rest* of the toolkit still works with no
  # ffmpeg at all, which is a supported configuration.
  without-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 14 sn
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Confirm ffmpeg really is absent
        run: |
          if command -v ffmpeg; then echo "ffmpeg is unexpectedly installed"; exit 1; fi

      - name: Install dependencies
        run: uv sync

      - name: Image tools must work without ffmpeg
        run: uv run pytest tests/test_image_tools.py tests/test_validation.py tests/test_paths_security.py tests/test_batch.py -v

      - name: A video tool must fail with a clear missing-dependency error
        run: |
          uv run python - <<'PY'
          from mini_creative_toolkit.engines import ffmpeg
          from mini_creative_toolkit.errors import MissingDependencyError
          try:
              ffmpeg.find("ffmpeg")
          except MissingDependencyError as exc:
              assert "PATH" in exc.message, exc.message
              assert "apt-get install ffmpeg" in exc.message, exc.message
              print("clear missing-dependency error:", exc.message[:80])
          else:
              raise SystemExit("expected MissingDependencyError with ffmpeg absent")
          PY

  surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 52 sn
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync

      # Both documented entry points must start. `toolkit.py` is what existing
      # MCP client configurations still say, so a break there is a break for
      # every current user.
      - name: The MCP server starts over stdio
        run: |
          echo "" | timeout 60 uv run python -m mini_creative_toolkit
          echo "" | timeout 60 uv run toolkit.py

      # What README "Register as an MCP server" tells people to run, started
      # from outside the checkout the way Claude Code starts it. The older
      # `uv run --project <repo> toolkit.py` passed the step above (run from
      # the repo root) and failed everywhere else: uv resolves toolkit.py
      # against the current directory.
      - name: The documented registration command works from another directory
        working-directory: ${{ runner.temp }}
        run: |
          # A real client keeps stdin open until it has its answers. Piping the
          # requests with printf closed stdin at once, and the server may shut
          # down before answering tools/list - which is what an earlier version
          # of this step raced on. Each reply is read before the next request.
          MCT_LOG_LEVEL=quiet timeout 120 python3 - <<'PY'
          import json, os, subprocess
          proc = subprocess.Popen(
              ["uv", "run", "--project", os.environ["GITHUB_WORKSPACE"], "mini-creative-toolkit"],
              stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True,
          )
          def send(message):
              proc.stdin.write(json.dumps(message) + "\n")
              proc.stdin.flush()
          def reply(request_id):
              for line in proc.stdout:
                  message = json.loads(line)
                  if message.get("id") == request_id:
                      return message
              raise SystemExit(f"server closed stdout before answering request {request_id}")
          send({"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {
              "protocolVersion": "2025-06-18", "capabilities": {},
              "clientInfo": {"name": "ci", "version": "0"}}})
          info = reply(1)["result"]["serverInfo"]
          send({"jsonrpc": "2.0", "method": "notifications/initialized"})
          send({"jsonrpc": "2.0", "id": 2, "method": "tools/list"})
          tools = reply(2)["result"]["tools"]
          proc.stdin.close()
          proc.wait(timeout=30)
          assert len(tools) == 23, len(tools)
          print("initialize:", info, "| tools/list:", len(tools))
          PY

      - name: The CLI works end to end
        run: |
          uv run mct --version
          uv run mct capabilities --json > caps.json
          python3 -c "import json; d=json.load(open('caps.json')); assert len(d['tools']) == 23, len(d['tools'])"
          uv run python -c "
          from PIL import Image
          Image.new('RGB', (200, 120), (10, 90, 200)).save('sample.png')
          "
          uv run mct inspect sample.png
          uv run mct resize sample.png --width 60 --height 60
          uv run mct optimize sample.png --goal web
          uv run mct strip-metadata sample.png
          uv run mct upscale sample.png --scale 2

      # The CLI's exit-code contract, asserted rather than assumed. These run
      # under `bash -e`, so each non-zero exit must be captured before it is
      # checked - a bare invocation would abort the step first.
      - name: A missing file exits 1, a usage error exits 2
        run: |
          set +e
          uv run mct resize does-not-exist.png --width 10 --height 10
          missing=$?
          uv run mct resize --width 10
          usage=$?
          set -e
          test "$missing" -eq 1 || { echo "expected exit 1 for a missing file, got $missing"; exit 1; }
          test "$usage" -eq 2 || { echo "expected exit 2 for a usage error, got $usage"; exit 1; }

      - name: No temporary artefacts survive a full CLI run
        run: |
          leftovers=$(find output -name '*.part-*' -o -name 'tmp-*' 2>/dev/null || true)
          test -z "$leftovers" || { echo "leftover temporary files: $leftovers"; exit 1; }

  # `yayinla.yml` yalniz `v*` etiketinde kosuyor, yani paketleme bozulursa
  # bunu ancak yayinlamaya calistigin an ogrenirsin. Kardes depo mcp-vet'te
  # tam olarak bu oldu: 244 test yesilken `uv build` calismiyordu, cunku
  # hicbir sey paketlemeyi denemiyordu. Bu is onu her push'a tasiyor.
  paket:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 15 sn
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0

      - name: Paket derleniyor mu
        run: uv build

      - name: Uretilen paket gecerli mi
        run: uvx twine check dist/*

      # Derlemenin basarili olmasi paketin icinde dogru dosyalarin oldugunu
      # kanitlamaz: eksik bir modul ya da yanlis bir giris noktasi ancak
      # kurulunca ortaya cikar.
      - name: Tekerlek kuruluyor ve giris noktasi yerinde
        run: |
          set -e
          uv venv /tmp/deneme
          VIRTUAL_ENV=/tmp/deneme uv pip install dist/*.whl
          test -x /tmp/deneme/bin/mct || { echo "konsol komutu uretilmedi: mct"; exit 1; }
          # server.json istemcilere `uvx mini-creative-toolkit` diyor; uvx paket
          # adiyla ayni isimli komutu ariyor.
          test -x /tmp/deneme/bin/mini-creative-toolkit || { echo "konsol komutu uretilmedi: mini-creative-toolkit"; exit 1; }
          # Sunucu stdio'da sonsuza kadar bloke oldugu icin CALISTIRILMIYOR;
          # hedefin var ve cagrilabilir oldugu dogrulaniyor.
          VIRTUAL_ENV=/tmp/deneme /tmp/deneme/bin/python -c "import mini_creative_toolkit.cli as m; assert callable(m.main), 'main cagrilabilir degil'"
          echo "mct kuruldu, giris noktasi cagrilabilir"

      - name: Kurulan komut calisiyor
        run: |
          set -e
          /tmp/deneme/bin/mct --help > /dev/null
          echo "mct --help calisti"

  denetim:
    name: mcp-vet (kendi sunucumuza kendi aracimiz)
    runs-on: ubuntu-latest
    timeout-minutes: 10  # olculen en uzun kosu 10 sn
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      # kaynaktan cikariyor -- hangi kimlik bilgilerine dokunuyor, nereye
      # baglaniyor, ne calistiriyor. Kendi sunucumuzu kendi aracimizla
      # denetlemek, aracin da sunucunun da yanlis bulgusunu ortaya cikariyor:
      # bu is eklenirken mcp-vet'te gercek bir yanlis pozitif bulundu ve
      # duzeltildi (savunma amacli bir denylist, kimlik okumak sanilmisti).
      - name: mcp-vet'i kur
        run: uv tool install git+https://github.com/Furkiozknn/mcp-vet

      # --offline: ag yok, yalnizca kaynak analizi. Depo zaten burada.
      - name: Denetle
        run: |
          # Actions bu kabugu `-e` ile calistiriyor. `... | tee` boru hatti
          # LOW bulguda 1 donuyor ve `-e` betigi tam orada olduruyor -- yani
          # asagidaki `case` hic kosmuyordu ve LOW bir sunucu kirmizi yaniyordu.
          # Cikis kodu `|| kod=$?` ile aliniyor, cunku `||` olan bir komut
          # `-e` icin sinanmis sayiliyor.
          set -uo pipefail
          kod=0
          mcp-vet audit --offline --path . > /tmp/mcpvet.txt 2>&1 || kod=$?
          cat /tmp/mcpvet.txt
          {
            echo '### mcp-vet'
            echo ''
            echo '```'
            cat /tmp/mcpvet.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # 0 temiz, 1 LOW/MEDIUM, 2 HIGH, 3 CRITICAL, 4 arac kosamadi.
          # Kapi HIGH ve uzerinde kapaniyor: LOW/MEDIUM bulgular bu sunucuda
          # gercek ve bilinen yetenekleri anlatiyor (dis surec calistirmak
          # gibi), onlari kirmiziya cevirmek kapiyi anlamsizlastirirdi.
          # Aracin kendisi kosamadiysa (4) bu da bir arizadir, yesil degil.
          case "$kod" in
            0|1) echo "gecti (cikis $kod)" ;;
            *)   echo "mcp-vet cikis $kod"; exit 1 ;;
          esac
