<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <radialGradient id="rbg" cx="50%" cy="35%" r="85%">
      <stop offset="0%" stop-color="#1a1408"/>
      <stop offset="60%" stop-color="#120e07"/>
      <stop offset="100%" stop-color="#0a0704"/>
    </radialGradient>
    <linearGradient id="rtitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd76d"/>
      <stop offset="55%" stop-color="#ff9f5a"/>
      <stop offset="100%" stop-color="#8effc2"/>
    </linearGradient>
    <linearGradient id="greenStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8effc2"/>
      <stop offset="100%" stop-color="#5fd9a0"/>
    </linearGradient>
    <linearGradient id="orangeStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd76d"/>
      <stop offset="100%" stop-color="#ff9f5a"/>
    </linearGradient>
    <filter id="rglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="rglowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="640" fill="url(#rbg)"/>

  <text x="600" y="56" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-weight="700" font-size="30" fill="url(#rtitle)">routing philosophy</text>
  <text x="600" y="86" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="15" fill="#e8ddc8" opacity="0.8">Bir dosya bu kapıdan girdiğinde nereye gider? — where a file goes once it enters this server</text>

  <!-- INPUT NODE -->
  <rect x="36" y="270" width="150" height="100" rx="14" fill="#1f1810" stroke="url(#rtitle)" stroke-width="2.5" filter="url(#rglow)"/>
  <text x="111" y="312" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="15" fill="#f5efe0" font-weight="700">your file</text>
  <text x="111" y="334" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#cbb98f">image / video</text>

  <!-- divider -->
  <line x1="230" y1="320" x2="1160" y2="320" stroke="#7a6a45" stroke-width="1" stroke-dasharray="3 6" opacity="0.4"/>

  <!-- ===== TOP LANE: the one generative exception ===== -->
  <path d="M186 300 C 220 260, 230 170, 260 150" fill="none" stroke="url(#orangeStroke)" stroke-width="3" filter="url(#rglowSoft)" marker-end="url(#arrowOrange)"/>

  <rect x="266" y="8" width="150" height="66" rx="10" fill="none" stroke="#7a4a3a" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.55"/>
  <line x1="272" y1="14" x2="410" y2="68" stroke="#ff6b6b" stroke-width="2.5" opacity="0.85"/>
  <text x="341" y="36" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="12" fill="#e8a99a">$ paid API</text>
  <text x="341" y="55" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#c98b7d">never called</text>
  <line x1="341" y1="74" x2="341" y2="112" stroke="#7a4a3a" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>

  <rect x="260" y="112" width="230" height="66" rx="12" fill="#241a0f" stroke="url(#orangeStroke)" stroke-width="2.5" filter="url(#rglow)"/>
  <text x="375" y="140" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="15" fill="#ffd76d" font-weight="700">generate_image_free</text>
  <text x="375" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#f0c98a">the one tool that leaves this machine</text>

  <path d="M490 145 L 528 145" stroke="url(#orangeStroke)" stroke-width="3" filter="url(#rglowSoft)" marker-end="url(#arrowOrange)"/>

  <path d="M534 100 Q 512 100 512 128 Q 490 130 490 154 Q 490 178 516 178 L 646 178 Q 672 178 672 154 Q 672 132 650 130 Q 648 100 610 100 Q 592 84 562 88 Q 546 90 534 100 Z" fill="#241a0f" stroke="url(#orangeStroke)" stroke-width="2.5" filter="url(#rglow)"/>
  <text x="581" y="135" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="14" fill="#ffd76d" font-weight="700">Pollinations.ai</text>
  <text x="581" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#f0c98a">free · no signup · no key</text>

  <path d="M678 145 L 750 145" stroke="url(#orangeStroke)" stroke-width="3" filter="url(#rglowSoft)" marker-end="url(#arrowOrange)"/>

  <rect x="756" y="112" width="170" height="66" rx="12" fill="#1f1810" stroke="url(#orangeStroke)" stroke-width="2" filter="url(#rglowSoft)"/>
  <text x="841" y="140" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="14" fill="#f5efe0" font-weight="700">image</text>
  <text x="841" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#cbb98f">saved to output/</text>

  <rect x="960" y="118" width="200" height="54" rx="10" fill="none" stroke="url(#orangeStroke)" stroke-width="1.5" opacity="0.85"/>
  <text x="1060" y="140" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="12" fill="#ffd76d">1 generative call</text>
  <text x="1060" y="157" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#e8ddc8" opacity="0.8">genuinely free, not a trial key</text>

  <!-- ===== BOTTOM LANE: deterministic + local ===== -->
  <path d="M186 340 C 220 380, 230 460, 260 480" fill="none" stroke="url(#greenStroke)" stroke-width="3" filter="url(#rglowSoft)" marker-end="url(#arrowGreen)"/>

  <rect x="260" y="440" width="700" height="120" rx="14" fill="#12200f" stroke="url(#greenStroke)" stroke-width="2.5" filter="url(#rglow)"/>
  <text x="610" y="465" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#8effc2" font-weight="700">7 tools · runs on THIS device · CPU only</text>

  <!-- chips -->
  <g font-family="'Cascadia Code','Consolas',monospace" font-size="11" fill="#e8ffe8">
    <g>
      <rect x="272" y="480" width="92" height="34" rx="8" fill="#1a2e16" stroke="#5fd9a0" stroke-width="1.3"/>
      <text x="318" y="501" text-anchor="middle">remove_bg</text>
    </g>
    <g>
      <rect x="370" y="480" width="80" height="34" rx="8" fill="#1a2e16" stroke="#5fd9a0" stroke-width="1.3"/>
      <text x="410" y="501" text-anchor="middle">resize</text>
    </g>
    <g>
      <rect x="456" y="480" width="80" height="34" rx="8" fill="#1a2e16" stroke="#5fd9a0" stroke-width="1.3"/>
      <text x="496" y="501" text-anchor="middle">convert</text>
    </g>
    <g>
      <rect x="542" y="480" width="92" height="34" rx="8" fill="#1a2e16" stroke="#5fd9a0" stroke-width="1.3"/>
      <text x="588" y="501" text-anchor="middle">thumbnail</text>
    </g>
    <g>
      <rect x="640" y="480" width="80" height="34" rx="8" fill="#1a2e16" stroke="#5fd9a0" stroke-width="1.3"/>
      <text x="680" y="501" text-anchor="middle">to_gif</text>
    </g>
    <g>
      <rect x="726" y="480" width="70" height="34" rx="8" fill="#1a2e16" stroke="#5fd9a0" stroke-width="1.3"/>
      <text x="761" y="501" text-anchor="middle">trim</text>
    </g>
    <g>
      <rect x="802" y="480" width="90" height="34" rx="8" fill="#1a2e16" stroke="#ff9f5a" stroke-width="1.3" stroke-dasharray="3 3"/>
      <text x="847" y="501" text-anchor="middle" fill="#ffd9ae">upscale*</text>
    </g>
  </g>

  <text x="610" y="537" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#bfe8c9">engines: rembg (ONNX) · Pillow · ffmpeg — deterministic, no model call, no network needed</text>
  <text x="847" y="552" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#e8ddc8" opacity="0.75">*local binary, but GPU-bound — see limitation ↓</text>

  <path d="M960 500 L 1030 500" stroke="url(#greenStroke)" stroke-width="3" filter="url(#rglowSoft)" marker-end="url(#arrowGreen)"/>

  <rect x="1036" y="467" width="130" height="66" rx="12" fill="#1f1810" stroke="url(#greenStroke)" stroke-width="2" filter="url(#rglowSoft)"/>
  <text x="1101" y="495" text-anchor="middle" font-family="'Cascadia Code','Consolas',monospace" font-size="13" fill="#f5efe0" font-weight="700">file</text>
  <text x="1101" y="514" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#bfe8c9">instantly, offline</text>

  <!-- legend -->
  <g font-family="Segoe UI, sans-serif" font-size="12" fill="#e8ddc8">
    <circle cx="70" cy="600" r="6" fill="#8effc2"/>
    <text x="86" y="605">deterministic — runs on this device</text>
    <circle cx="430" cy="600" r="6" fill="#ff9f5a"/>
    <text x="446" y="605">the one exception — free hosted API, no key</text>
    <circle cx="860" cy="600" r="6" fill="#ff6b6b"/>
    <line x1="854" y1="594" x2="866" y2="606" stroke="#1a1408" stroke-width="1.5"/>
    <text x="876" y="605">paid API — deliberately never called</text>
  </g>

  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ff9f5a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8effc2"/>
    </marker>
  </defs>
</svg>
